<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Удаление человека из видео</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js"></script>
<style>
:root{--bg:#eef0f6;--panel:#fff;--ink:#1a1d29;--mute:#6b7186;--acc:#4766e5;--line:#d9dce8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--panel:#1c202c;--ink:#e8eaf2;--mute:#8b92aa;--acc:#8aa4ff;--line:#2b3040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top,0) 12px 24px}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
h1{font-size:18px;margin:14px 0 0}
label{display:block;color:var(--mute);font-size:13px;margin-top:8px}
label b{color:var(--ink);float:right}
input,select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{padding:0;accent-color:var(--acc)}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;margin-top:10px;width:100%}
@media (prefers-color-scheme:dark){button{color:#12141c}}
button:disabled{opacity:.5}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
canvas{display:block;margin:0 auto;max-width:100%;max-height:55vh;background:#000;border-radius:10px}
#st{color:var(--mute);margin-top:8px;min-height:20px}
.row{display:flex;gap:8px}.row>*{flex:1}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Удаление человека из видео</h1>
  <div class="card">
    <input type="file" id="file" accept="video/*">
    <p class="hint">Работает, когда камера не двигается (штатив). Человек должен хотя бы на части кадров не закрывать нужное место.</p>
    <div class="row">
      <div><label>Качество</label><select id="res"><option>480</option><option selected>640</option><option>854</option></select></div>
      <div><label>Секунд</label><input type="number" id="secs" value="5" min="1" max="10"></div>
      <div><label>Кадров/с</label><input type="number" id="fps" value="15" min="8" max="30"></div>
    </div>
    <label>Запас вокруг человека (тени, края) <b id="vm">10</b></label><input type="range" id="mg" min="0" max="30" value="10">
    <button id="go">Убрать человека</button>
    <div id="st"></div>
  </div>
  <div class="card">
    <canvas id="out" width="360" height="640"></canvas>
    <label>Кадр</label><input type="range" id="seek" min="0" max="0" value="0">
    <div class="row"><button class="g" id="cmp" disabled>Показать «до»</button><button id="play" disabled>Пуск</button></div>
    <button id="exp" disabled>Скачать видео</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id), out=$('out'), oc=out.getContext('2d');
const say=s=>$('st').textContent=s, yld=()=>new Promise(r=>setTimeout(r));
let sess=null, W=360, H=640, FPS=15, frames=[], origs=[], playing=false, showOrig=false;
const blob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
$('mg').oninput=()=>$('vm').textContent=$('mg').value;

async function loadModel(){
  if(sess) return; say('Загружаю модель…');
  const r=await fetch('rvm_mobilenetv3_fp32.onnx');
  if(!r.ok) throw new Error('Файл rvm_mobilenetv3_fp32.onnx не найден рядом с index.html');
  ort.env.wasm.numThreads=1;
  sess=await ort.InferenceSession.create(await r.arrayBuffer(),{executionProviders:['wasm']});
}
function dil(m,w,h,r){
  if(!r) return m; const t=new Uint8Array(w*h), o=new Uint8Array(w*h);
  for(let y=0;y<h;y++){let s=0;const b=y*w;for(let x=0;x<=Math.min(r,w-1);x++)s+=m[b+x];
    for(let x=0;x<w;x++){t[b+x]=s>0?1:0;const a=x+r+1,d=x-r;if(a<w)s+=m[b+a];if(d>=0)s-=m[b+d]}}
  for(let x=0;x<w;x++){let s=0;for(let y=0;y<=Math.min(r,h-1);y++)s+=t[y*w+x];
    for(let y=0;y<h;y++){o[y*w+x]=s>0?1:0;const a=y+r+1,d=y-r;if(a<h)s+=t[a*w+x];if(d>=0)s-=t[d*w+x]}}
  return o;
}
function soft(m,w,h,r){
  const t=new Float32Array(w*h), o=new Uint8Array(w*h);
  for(let y=0;y<h;y++){const b=y*w;let s=0;for(let x=0;x<=Math.min(r,w-1);x++)s+=m[b+x];
    for(let x=0;x<w;x++){const c=Math.min(w-1,x+r)-Math.max(0,x-r)+1;t[b+x]=s/c;const a=x+r+1,d=x-r;if(a<w)s+=m[b+a];if(d>=0)s-=m[b+d]}}
  for(let x=0;x<w;x++){let s=0;for(let y=0;y<=Math.min(r,h-1);y++)s+=t[y*w+x];
    for(let y=0;y<h;y++){const c=Math.min(h-1,y+r)-Math.max(0,y-r)+1;o[y*w+x]=255*s/c;const a=y+r+1,d=y-r;if(a<h)s+=t[a*w+x];if(d>=0)s-=t[d*w+x]}}
  return o;
}

async function run(){
  const f=$('file').files[0]; if(!f) return say('Сначала выберите видео');
  $('go').disabled=true; ['play','exp','cmp'].forEach(i=>$(i).disabled=true); playing=false; showOrig=false;
  try{
    await loadModel();
    const v=document.createElement('video'); v.src=URL.createObjectURL(f); v.muted=true; v.playsInline=true;
    await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(new Error('Не удалось открыть видео'))});
    const s=Math.min(1,+$('res').value/Math.max(v.videoWidth,v.videoHeight));
    W=Math.max(16,Math.round(v.videoWidth*s/16)*16); H=Math.max(16,Math.round(v.videoHeight*s/16)*16);
    FPS=+$('fps').value; const n=Math.floor(Math.min(v.duration,+$('secs').value)*FPS), N=W*H;
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const x=c.getContext('2d',{willReadFrequently:true});
    const ratio=Math.min(1,384/Math.max(W,H)), z=()=>new ort.Tensor('float32',new Float32Array(1),[1,1,1,1]);
    let st=[z(),z(),z(),z()]; const dr=new ort.Tensor('float32',new Float32Array([ratio]),[1]);
    origs=[]; const masks=[]; const t0=performance.now(); const R=+$('mg').value;

    for(let i=0;i<n;i++){
      const sk=new Promise(r=>v.addEventListener('seeked',r,{once:true}));
      v.currentTime=(i+0.5)/FPS; await sk;
      x.drawImage(v,0,0,W,H);
      const d=x.getImageData(0,0,W,H).data, a=new Float32Array(3*N);
      for(let p=0;p<N;p++){a[p]=d[p*4]/255;a[N+p]=d[p*4+1]/255;a[2*N+p]=d[p*4+2]/255}
      const o=await sess.run({src:new ort.Tensor('float32',a,[1,3,H,W]),r1i:st[0],r2i:st[1],r3i:st[2],r4i:st[3],downsample_ratio:dr});
      st=[o.r1o,o.r2o,o.r3o,o.r4o];
      const ph=o.pha.data, m=new Uint8Array(N);
      for(let p=0;p<N;p++) m[p]=ph[p]>0.1?1:0;
      masks.push(dil(m,W,H,R)); origs.push(d);
      const el=(performance.now()-t0)/1000;
      say(`Ищу человека: кадр ${i+1} из ${n}, осталось ~${Math.round(el/(i+1)*(n-i-1))} с`);
    }

    // чистый фон: медиана по кадрам, где человека нет
    say('Собираю чистый фон…'); await yld();
    const plate=new Uint8ClampedArray(N*4), known=new Uint8Array(N), tmp=new Uint8Array(n); const holes=[];
    for(let p=0;p<N;p++){
      if(p%20000===0) await yld();
      for(let ch=0;ch<3;ch++){
        let k=0; for(let i=0;i<n;i++) if(!masks[i][p]) tmp[k++]=origs[i][p*4+ch];
        if(!k){ if(!ch) holes.push(p); break }
        const sub=tmp.subarray(0,k); sub.sort(); plate[p*4+ch]=sub[k>>1];
        if(ch===2) known[p]=1;
      }
      plate[p*4+3]=255;
    }
    // места, где человек был всегда: достраиваем от соседей
    let left=holes, guard=0;
    while(left.length&&guard++<W+H){
      if(guard%10===0){say(`Достраиваю закрытые места: осталось ${left.length}`);await yld()}
      const add=[], rest=[];
      for(const p of left){
        const px=p%W, py=(p/W)|0, nb=[];
        if(px>0&&known[p-1])nb.push(p-1); if(px<W-1&&known[p+1])nb.push(p+1);
        if(py>0&&known[p-W])nb.push(p-W); if(py<H-1&&known[p+W])nb.push(p+W);
        if(nb.length){let r=0,g=0,b=0;for(const q of nb){r+=plate[q*4];g+=plate[q*4+1];b+=plate[q*4+2]}
          add.push([p,r/nb.length,g/nb.length,b/nb.length])}
        else rest.push(p);
      }
      for(const [p,r,g,b] of add){plate[p*4]=r;plate[p*4+1]=g;plate[p*4+2]=b;plate[p*4+3]=255;known[p]=1}
      left=rest;
    }

    // сборка кадров
    frames=[]; const im=x.createImageData(W,H);
    for(let i=0;i<n;i++){
      say(`Собираю кадры ${i+1} из ${n}`); await yld();
      const al=soft(masks[i],W,H,3), d=origs[i], q=im.data;
      for(let p=0;p<N;p++){
        const a=al[p]/255, k=p*4;
        q[k]=d[k]*(1-a)+plate[k]*a; q[k+1]=d[k+1]*(1-a)+plate[k+1]*a; q[k+2]=d[k+2]*(1-a)+plate[k+2]*a; q[k+3]=255;
      }
      x.putImageData(im,0,0);
      frames.push(await blob(c,'image/jpeg',.93));
    }
    out.width=W; out.height=H; $('seek').max=n-1; $('seek').value=0; await draw(0);
    say('Готово. Если остались следы, увеличьте запас вокруг человека и повторите.');
    ['play','exp','cmp'].forEach(i=>$(i).disabled=false);
  }catch(e){say('Ошибка: '+e.message);console.error(e)}
  $('go').disabled=false;
}

async function draw(i){
  if(showOrig){oc.putImageData(new ImageData(origs[i],W,H),0,0);return}
  const b=await createImageBitmap(frames[i]); oc.drawImage(b,0,0,W,H); b.close();
}
$('go').onclick=run;
$('seek').oninput=()=>frames.length&&draw(+$('seek').value);
$('cmp').onclick=()=>{showOrig=!showOrig;$('cmp').textContent=showOrig?'Показать «после»':'Показать «до»';draw(+$('seek').value)};
$('play').onclick=async()=>{
  if(playing){playing=false;$('play').textContent='Пуск';return}
  playing=true;$('play').textContent='Пауза';
  let i=+$('seek').value; if(i>=frames.length-1) i=0;
  for(;i<frames.length&&playing;i++){
    const t=performance.now(); $('seek').value=i; await draw(i);
    await new Promise(r=>setTimeout(r,Math.max(0,1000/FPS-(performance.now()-t))));
  }
  playing=false;$('play').textContent='Пуск';
};
$('exp').onclick=async()=>{
  playing=false; showOrig=false; $('cmp').textContent='Показать «до»'; $('exp').disabled=true; $('play').disabled=true;
  const types=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(out.captureStream(FPS),{mimeType:mime,videoBitsPerSecond:8e6});
  const parts=[]; rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
  const done=new Promise(r=>rec.onstop=r); rec.start();
  for(let i=0;i<frames.length;i++){
    const t=performance.now(); say(`Запись ${i+1} из ${frames.length}`); await draw(i);
    await new Promise(r=>setTimeout(r,Math.max(0,1000/FPS-(performance.now()-t))));
  }
  rec.stop(); await done;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(parts,{type:mime||'video/webm'}));
  a.download='clean.'+(mime.includes('mp4')?'mp4':'webm'); a.click();
  say('Видео сохранено (без звука).'); $('exp').disabled=false; $('play').disabled=false;
};
</script>
</body>
</html>
